<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elgemo</title>
<link rel="icon" href="/favicon.ico" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a14; color: #f3f4f6; min-height: 100vh; }

  /* ── Lobby ─────────────────────────────────── */
  #lobby { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
  .logo-mark { width: 64px; height: 64px; border-radius: 20px; background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
  .logo-mark i { font-size: 28px; color: #3b82f6; }
  .logo { font-size: 32px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; color: #f9fafb; }
  .tagline { color: #6b7280; font-size: 14px; margin-bottom: 40px; }
  .card { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; padding: 20px; width: 100%; max-width: 400px; margin-bottom: 0; }
  .card-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
  .card-icon-wrap { width: 38px; height: 38px; min-width: 38px; border-radius: 10px; background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.2); display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .card-icon-wrap i { font-size: 15px; color: #3b82f6; }
  .card h2 { font-size: 17px; font-weight: 700; margin-bottom: 3px; color: #f3f4f6; }
  .card p { color: #6b7280; font-size: 13px; line-height: 1.5; }
  .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 13px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-primary:hover { opacity: 0.88; }
  .btn-primary:disabled { opacity: 0.45; cursor: default; }
  .btn-secondary { width: 100%; padding: 14px; border: 1px solid rgba(59,130,246,0.25); border-radius: 13px; background: rgba(37,99,235,0.1); color: #60a5fa; font-size: 15px; font-weight: 700; cursor: pointer; transition: opacity 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn-secondary:hover { opacity: 0.88; }
  .btn-secondary:disabled { opacity: 0.45; cursor: default; }
  .code-input { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.08); border-radius: 13px; background: rgba(255,255,255,0.06); color: #f3f4f6; font-size: 22px; font-weight: 700; text-align: center; letter-spacing: 6px; margin-bottom: 12px; outline: none; text-transform: uppercase; }
  .code-input::placeholder { letter-spacing: 1px; font-size: 14px; font-weight: 400; color: #4b5563; }
  .code-input:focus { border-color: rgba(59,130,246,0.4); }
  .divider { display: flex; align-items: center; width: 100%; max-width: 400px; margin: 20px 0; }
  .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.1); }
  .divider-text { color: #4b5563; margin: 0 16px; font-size: 13px; font-weight: 500; }
  .footer { color: #374151; font-size: 12px; margin-top: 28px; display: flex; align-items: center; gap: 5px; }
  .error-msg { color: #f87171; font-size: 13px; margin-top: 10px; text-align: center; }

  /* ── Call ───────────────────────────────────── */
  #call { display: none; position: fixed; inset: 0; background: #000; }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; background: #111827; }
  #localVideo { position: absolute; top: 16px; right: 16px; width: 140px; height: 190px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.18); background: #111827; z-index: 10; box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .top-bar { position: absolute; top: 0; left: 0; right: 0; padding: 16px 20px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10; }
  .room-info { display: flex; align-items: center; gap: 8px; }
  .room-label { color: rgba(255,255,255,0.45); font-size: 13px; font-weight: 500; }
  .room-code-badge { color: #f3f4f6; font-size: 15px; font-weight: 700; letter-spacing: 2px; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px; }
  .room-code-badge i { font-size: 11px; opacity: 0.45; }
  .status-pill { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 16px; font-size: 13px; font-weight: 600; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Waiting overlay */
  .waiting-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; background: rgba(0,0,0,0.5); }
  .waiting-overlay h2 { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .waiting-overlay .sub { color: #9ca3af; margin-bottom: 12px; }
  .code-display { background: rgba(59,130,246,0.18); border: 1px solid rgba(59,130,246,0.3); border-radius: 16px; padding: 18px 32px; text-align: center; cursor: pointer; }
  .code-display .code { color: #60a5fa; font-size: 36px; font-weight: 800; letter-spacing: 8px; }
  .code-display .hint { color: rgba(96,165,250,0.55); font-size: 12px; margin-top: 6px; display: flex; align-items: center; justify-content: center; gap: 4px; }

  /* Controls */
  .controls { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px 12px 28px; background: rgba(10,10,20,0.85); border-top: 1px solid rgba(255,255,255,0.08); border-radius: 24px 24px 0 0; display: flex; justify-content: space-around; z-index: 10; }
  .ctrl-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 62px; height: 62px; border-radius: 31px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.1); cursor: pointer; transition: background 0.15s; position: relative; gap: 4px; }
  .ctrl-btn:hover { background: rgba(255,255,255,0.16); }
  .ctrl-btn.active { background: rgba(251,191,36,0.18); border-color: rgba(251,191,36,0.35); }
  .ctrl-btn.danger { background: rgba(239,68,68,0.28); border-color: rgba(239,68,68,0.45); }
  .ctrl-btn .icon { font-size: 20px; color: #e5e7eb; line-height: 1; }
  .ctrl-btn.active .icon { color: #fbbf24; }
  .ctrl-btn.danger .icon { color: #fca5a5; }
  .ctrl-btn .lbl { color: #d1d5db; font-size: 10px; font-weight: 500; }
  .ctrl-btn.active .lbl { color: #fbbf24; }
  .ctrl-btn.danger .lbl { color: #fca5a5; }
  .badge { position: absolute; top: 4px; right: 5px; background: #ef4444; color: #fff; border-radius: 9px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; padding: 0 4px; border: 1.5px solid rgba(0,0,0,0.4); }

  /* ── Chat ───────────────────────────────────── */
  #chatPanel { position: absolute; bottom: 0; left: 0; right: 0; height: 60%; background: rgba(12,12,24,0.97); border-top: 1px solid rgba(255,255,255,0.1); border-radius: 20px 20px 0 0; z-index: 20; display: none; flex-direction: column; }
  #chatPanel.open { display: flex; }
  .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .chat-header-left { display: flex; align-items: center; gap: 8px; }
  .chat-header-left i { font-size: 16px; color: #60a5fa; }
  .chat-header h3 { font-size: 16px; font-weight: 700; }
  .chat-close { width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,0.08); border: none; color: #9ca3af; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
  .chat-close:hover { background: rgba(255,255,255,0.14); }
  .chat-messages { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; }
  .chat-empty { color: #4b5563; text-align: center; padding-top: 48px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .chat-empty i { font-size: 28px; color: #1f2937; }
  .msg { max-width: 78%; padding: 9px 14px; border-radius: 18px; margin-bottom: 6px; }
  .msg.mine { align-self: flex-end; margin-left: auto; background: #2563eb; border-bottom-right-radius: 4px; }
  .msg.peer { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 4px; }
  .msg .text { font-size: 15px; line-height: 1.4; }
  .msg .time { font-size: 10px; margin-top: 4px; opacity: 0.55; }
  .msg.mine .time { text-align: right; }
  .chat-input-row { display: flex; align-items: center; padding: 10px 12px; border-top: 1px solid rgba(255,255,255,0.08); gap: 8px; }
  .chat-input { flex: 1; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); border-radius: 22px; padding: 10px 16px; color: #f3f4f6; font-size: 15px; outline: none; }
  .chat-input::placeholder { color: #6b7280; }
  .chat-input:focus { border-color: rgba(59,130,246,0.35); }
  .chat-send { width: 40px; height: 40px; min-width: 40px; background: #2563eb; border: none; border-radius: 50%; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity 0.15s; }
  .chat-send:hover { opacity: 0.85; }
</style>
</head>
<body>

<!-- ════════ LOBBY ════════ -->
<div id="lobby">
  <div class="logo-mark">
    <i class="fa-solid fa-video"></i>
  </div>
  <div class="logo">Elgemo</div>
  <div class="tagline">Video chat, no account needed</div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon-wrap"><i class="fa-solid fa-plus"></i></div>
      <div>
        <h2>Start a call</h2>
        <p>Create a room and share the code with someone to connect.</p>
      </div>
    </div>
    <button class="btn-primary" id="createBtn" onclick="createRoom()">
      <i class="fa-solid fa-video"></i> Create Room
    </button>
  </div>

  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">or</span>
    <div class="divider-line"></div>
  </div>

  <div class="card">
    <div class="card-header">
      <div class="card-icon-wrap"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
      <div>
        <h2>Join a call</h2>
        <p>Enter the room code shared with you.</p>
      </div>
    </div>
    <input class="code-input" id="joinInput" placeholder="Room code" maxlength="8" autocomplete="off">
    <button class="btn-secondary" id="joinBtn" onclick="joinRoom()" disabled>
      <i class="fa-solid fa-arrow-right-to-bracket"></i> Join Room
    </button>
  </div>

  <div id="lobbyError" class="error-msg"></div>
  <div class="footer">
    <i class="fa-solid fa-lock" style="font-size:11px"></i>
    Peer-to-peer. No data stored.
  </div>
</div>

<!-- ════════ CALL ════════ -->
<div id="call">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>

  <div class="top-bar">
    <div class="room-info">
      <span class="room-label">Room</span>
      <span class="room-code-badge" id="callRoomCode" onclick="copyCode()">
        <span id="callRoomCodeText"></span>
        <i class="fa-regular fa-copy"></i>
      </span>
    </div>
    <div class="status-pill" id="statusPill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connecting</span>
    </div>
  </div>

  <div class="waiting-overlay" id="waitingOverlay">
    <h2 id="waitingTitle">Waiting for someone to join...</h2>
    <p class="sub" id="waitingSub">Share this code:</p>
    <div class="code-display" onclick="copyCode()">
      <div class="code" id="waitingCode"></div>
      <div class="hint"><i class="fa-regular fa-copy"></i> Click to copy</div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()">
      <i class="fa-solid fa-microphone icon"></i>
      <span class="lbl">Mute</span>
    </button>
    <button class="ctrl-btn" id="camBtn" onclick="toggleCamera()">
      <i class="fa-solid fa-video icon"></i>
      <span class="lbl">Hide</span>
    </button>
    <button class="ctrl-btn" id="chatBtn" onclick="toggleChat()">
      <i class="fa-regular fa-message icon"></i>
      <span class="lbl">Chat</span>
      <div class="badge" id="chatBadge" style="display:none">0</div>
    </button>
    <button class="ctrl-btn danger" onclick="endCall()">
      <i class="fa-solid fa-phone-slash icon"></i>
      <span class="lbl">End</span>
    </button>
  </div>

  <!-- Chat Panel -->
  <div id="chatPanel">
    <div class="chat-header">
      <div class="chat-header-left">
        <i class="fa-regular fa-comments"></i>
        <h3>Chat</h3>
      </div>
      <button class="chat-close" onclick="toggleChat()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <div class="chat-empty" id="chatEmpty">
        <i class="fa-regular fa-comment-dots"></i>
        No messages yet
      </div>
    </div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendChat()">
      <button class="chat-send" onclick="sendChat()">
        <i class="fa-solid fa-arrow-up"></i>
      </button>
    </div>
  </div>
</div>

<!-- Socket.IO from CDN (not from the server itself) -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
// ─── CONFIGURATION ─────────────────────────────────────────────────
// Set this to your deployed signaling server URL (Render, Railway, etc.)
// In production this is read from window.__ENV or falls back to same-origin.
const SIGNALING_URL = window.__ENV?.SIGNALING_URL || '';

// ── State ──────────────────────────────────────────────────────────
let socket = null;
let pc = null;
let localStream = null;
let roomCode = '';
let role = '';
let isMuted = false;
let isCamOff = false;
let chatOpen = false;
let unread = 0;
let mySocketId = '';

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
];

// ── DOM refs ───────────────────────────────────────────────────────
const $lobby = document.getElementById('lobby');
const $call = document.getElementById('call');
const $joinInput = document.getElementById('joinInput');
const $joinBtn = document.getElementById('joinBtn');
const $createBtn = document.getElementById('createBtn');
const $lobbyError = document.getElementById('lobbyError');
const $remoteVideo = document.getElementById('remoteVideo');
const $localVideo = document.getElementById('localVideo');
const $callRoomCodeText = document.getElementById('callRoomCodeText');
const $waitingOverlay = document.getElementById('waitingOverlay');
const $waitingTitle = document.getElementById('waitingTitle');
const $waitingSub = document.getElementById('waitingSub');
const $waitingCode = document.getElementById('waitingCode');
const $statusDot = document.getElementById('statusDot');
const $statusText = document.getElementById('statusText');
const $statusPill = document.getElementById('statusPill');
const $muteBtn = document.getElementById('muteBtn');
const $camBtn = document.getElementById('camBtn');
const $chatPanel = document.getElementById('chatPanel');
const $chatMessages = document.getElementById('chatMessages');
const $chatInput = document.getElementById('chatInput');
const $chatBadge = document.getElementById('chatBadge');
const $chatEmpty = document.getElementById('chatEmpty');

$joinInput.addEventListener('input', () => {
  $joinInput.value = $joinInput.value.toUpperCase();
  $joinBtn.disabled = $joinInput.value.trim().length < 6;
});

// ── Socket connect ─────────────────────────────────────────────────
function connectSocket() {
  return new Promise((resolve, reject) => {
    if (socket && socket.connected) { resolve(); return; }
    socket = io(SIGNALING_URL, { transports: ['websocket'] });
    socket.on('connect', () => { mySocketId = socket.id; resolve(); });
    socket.on('connect_error', (e) => reject(e));

    socket.on('user-joined', onUserJoined);
    socket.on('user-left', onUserLeft);
    socket.on('room-closed', onRoomClosed);
    socket.on('offer', onOffer);
    socket.on('answer', onAnswer);
    socket.on('ice-candidate', onIceCandidate);
    socket.on('chat-message', onChatMessage);
    socket.on('peer-reconnecting', () => setStatus('reconnecting'));
    socket.on('peer-reconnected', () => setStatus('connected'));
  });
}

// ── Create / Join ──────────────────────────────────────────────────
async function createRoom() {
  $lobbyError.textContent = '';
  $createBtn.disabled = true;
  try {
    await startMedia();
    await connectSocket();
    socket.emit('create-room', (res) => {
      if (!res.ok) { $lobbyError.textContent = res.error; $createBtn.disabled = false; return; }
      roomCode = res.code;
      role = 'host';
      showCall();
    });
  } catch (e) {
    $lobbyError.textContent = e.message || 'Could not connect to signaling server';
    $createBtn.disabled = false;
  }
}

async function joinRoom() {
  $lobbyError.textContent = '';
  const code = $joinInput.value.trim().toUpperCase();
  if (code.length < 6) return;
  $joinBtn.disabled = true;
  try {
    await startMedia();
    await connectSocket();
    socket.emit('join-room', { code }, (res) => {
      if (!res.ok) { $lobbyError.textContent = res.error; $joinBtn.disabled = false; return; }
      roomCode = code;
      role = 'guest';
      showCall();
    });
  } catch (e) {
    $lobbyError.textContent = e.message || 'Could not join room';
    $joinBtn.disabled = false;
  }
}

// ── Media ──────────────────────────────────────────────────────────
async function startMedia() {
  if (localStream) return;
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  $localVideo.srcObject = localStream;
}

// ── Show call screen ───────────────────────────────────────────────
function showCall() {
  $lobby.style.display = 'none';
  $call.style.display = 'block';
  $callRoomCodeText.textContent = roomCode;
  $waitingCode.textContent = roomCode;

  if (role === 'host') {
    $waitingOverlay.style.display = 'flex';
    $waitingTitle.textContent = 'Waiting for someone to join...';
    $waitingSub.style.display = '';
    setStatus('waiting');
  } else {
    $waitingOverlay.style.display = 'flex';
    $waitingTitle.textContent = 'Connecting...';
    $waitingSub.style.display = 'none';
    document.querySelector('.code-display').style.display = 'none';
    setStatus('connecting');
  }
}

// ── WebRTC ─────────────────────────────────────────────────────────
let pendingCandidates = [];

function createPC() {
  if (pc) { pc.close(); pc = null; }
  pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });

  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = (e) => {
    $remoteVideo.srcObject = e.streams[0];
    $waitingOverlay.style.display = 'none';
  };

  pc.onicecandidate = (e) => {
    if (e.candidate) socket.emit('ice-candidate', { candidate: e.candidate.toJSON() });
  };

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') setStatus('connected');
    else if (s === 'disconnected' || s === 'failed') setStatus('reconnecting');
    else if (s === 'closed') setStatus('disconnected');
  };

  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === 'failed') {
      pc.createOffer({ iceRestart: true }).then(o => pc.setLocalDescription(o)).then(() => {
        socket.emit('offer', { sdp: pc.localDescription });
      });
    }
  };
}

async function onUserJoined({ peerId }) {
  $waitingOverlay.style.display = 'none';
  setStatus('connecting');
  createPC();
  if (role === 'host') {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit('offer', { sdp: pc.localDescription });
  }
}

async function onOffer({ sdp }) {
  if (!pc) createPC();
  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  await flushCandidates();
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  socket.emit('answer', { sdp: pc.localDescription });
}

async function onAnswer({ sdp }) {
  if (!pc) return;
  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  await flushCandidates();
}

async function onIceCandidate({ candidate }) {
  if (!pc) return;
  if (!pc.remoteDescription) { pendingCandidates.push(candidate); return; }
  try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {}
}

async function flushCandidates() {
  const q = [...pendingCandidates]; pendingCandidates = [];
  for (const c of q) { try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch {} }
}

function onUserLeft({ reason }) {
  $remoteVideo.srcObject = null;
  if (pc) { pc.close(); pc = null; }
  if (role === 'host') {
    $waitingOverlay.style.display = 'flex';
    $waitingTitle.textContent = 'Peer left. Waiting for someone...';
    $waitingSub.style.display = '';
    document.querySelector('.code-display').style.display = '';
    setStatus('waiting');
  }
}

function onRoomClosed({ reason }) {
  alert(reason);
  doLeave();
}

// ── Controls ───────────────────────────────────────────────────────
function toggleMute() {
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  const icon = $muteBtn.querySelector('.icon');
  icon.className = `fa-solid ${isMuted ? 'fa-microphone-slash' : 'fa-microphone'} icon`;
  $muteBtn.querySelector('.lbl').textContent = isMuted ? 'Unmute' : 'Mute';
  $muteBtn.classList.toggle('active', isMuted);
}

function toggleCamera() {
  isCamOff = !isCamOff;
  localStream.getVideoTracks().forEach(t => t.enabled = !isCamOff);
  const icon = $camBtn.querySelector('.icon');
  icon.className = `fa-solid ${isCamOff ? 'fa-video-slash' : 'fa-video'} icon`;
  $camBtn.querySelector('.lbl').textContent = isCamOff ? 'Show' : 'Hide';
  $camBtn.classList.toggle('active', isCamOff);
}

function endCall() {
  if (confirm('Leave the call?')) doLeave();
}

function doLeave() {
  if (socket) socket.emit('leave-room');
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  $remoteVideo.srcObject = null;
  $localVideo.srcObject = null;
  $call.style.display = 'none';
  $lobby.style.display = 'flex';
  $createBtn.disabled = false;
  $joinBtn.disabled = $joinInput.value.trim().length < 6;
  chatOpen = false; unread = 0;
  $chatPanel.classList.remove('open');
  $chatMessages.innerHTML = '<div class="chat-empty" id="chatEmpty"><i class="fa-regular fa-comment-dots"></i>No messages yet</div>';
  if (socket) { socket.disconnect(); socket = null; }
}

function copyCode() {
  navigator.clipboard.writeText(roomCode);
}

// ── Status ─────────────────────────────────────────────────────────
function setStatus(s) {
  const map = {
    waiting:      { text: 'Waiting for peer...', color: '#fbbf24', bg: 'rgba(251,191,36,0.15)' },
    connecting:   { text: 'Connecting...',       color: '#fbbf24', bg: 'rgba(251,191,36,0.15)' },
    connected:    { text: 'Connected',           color: '#34d399', bg: 'rgba(52,211,153,0.15)' },
    reconnecting: { text: 'Reconnecting...',     color: '#fb923c', bg: 'rgba(251,146,60,0.15)' },
    disconnected: { text: 'Disconnected',        color: '#f87171', bg: 'rgba(248,113,113,0.15)' },
  };
  const c = map[s] || map.connecting;
  $statusDot.style.background = c.color;
  $statusText.textContent = c.text;
  $statusText.style.color = c.color;
  $statusPill.style.background = c.bg;
}

// ── Chat ───────────────────────────────────────────────────────────
function toggleChat() {
  chatOpen = !chatOpen;
  $chatPanel.classList.toggle('open', chatOpen);
  if (chatOpen) { unread = 0; $chatBadge.style.display = 'none'; $chatInput.focus(); }
}

function sendChat() {
  const text = $chatInput.value.trim();
  if (!text || !socket) return;
  socket.emit('chat-message', { text });
  $chatInput.value = '';
}

function onChatMessage(msg) {
  document.getElementById('chatEmpty')?.remove();
  const mine = msg.senderId === mySocketId;
  const d = document.createElement('div');
  d.className = 'msg ' + (mine ? 'mine' : 'peer');
  const t = new Date(msg.timestamp);
  d.innerHTML = `<div class="text">${escHtml(msg.text)}</div><div class="time">${t.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>`;
  $chatMessages.appendChild(d);
  $chatMessages.scrollTop = $chatMessages.scrollHeight;
  if (!mine && !chatOpen) {
    unread++;
    $chatBadge.textContent = unread > 9 ? '9+' : unread;
    $chatBadge.style.display = 'flex';
  }
}

function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
